name: Publish reviewed release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag attached to the reviewed candidate (for example v3.2.3)
        required: true
        type: string
      build_run_id:
        description: Run ID of the successful Release builds workflow reviewed by maintainers
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Verify and publish reviewed assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Confirm exact version tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v3.2.3" >&2
            exit 1
          fi
          if [[ ! "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Build run ID must be numeric" >&2
            exit 1
          fi
          git tag --points-at HEAD | grep -Fx -- "$RELEASE_TAG" >/dev/null
      - name: Download reviewed candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: OpenPlotter-release-candidate
          path: assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}
      - name: Verify candidate source and checksums
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(cat assets/SOURCE-TAG.txt)" = "Source tag: $RELEASE_TAG"
          test "$(cat assets/SOURCE-COMMIT.txt)" = "Source commit: $(git rev-parse HEAD)"
          (cd assets && sha256sum --check SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release already exists for $RELEASE_TAG; refusing to replace it." >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" assets/* --verify-tag --generate-notes
