; ============================================================================
; OpenPlotter — PlatformIO Build Configuration
; ============================================================================
; Supported environments:
;   mega_ramps14  — Arduino Mega 2560 + RAMPS 1.4 shield (PRIMARY)
;   mega          — Arduino Mega 2560 standalone
;   nano          — Arduino Nano (ATmega328P)
;   esp32         — ESP32 DevKit standalone
;   mega_hybrid   — Mega motion controller (flash to Mega in hybrid setup)
;   esp32_bridge  — ESP32 WiFi bridge (flash to ESP32 in hybrid setup)
;   nano_hybrid   — Nano motion controller (flash to Nano in hybrid setup)
;   native        — Native platform for unit tests
; ============================================================================

[platformio]
default_envs = mega_ramps14
src_dir = src
include_dir = include

; ── Shared settings ──────────────────────────────────────────────────────────
[common]
framework = arduino
monitor_speed = 115200
build_flags =
    -DOPENPLOTTER_VERSION=\"1.0.0\"
    -DOPENPLOTTER_BUILD_DATE=__DATE__
    -Wall
    -Wextra
    -Wno-unused-parameter
lib_deps =
    TMCStepper@^0.7.3

[common_avr]
platform = atmelavr
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}

[common_esp32]
platform = espressif32
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.filesystem = littlefs

; ── Arduino Mega 2560 + RAMPS 1.4 (YOUR PRIMARY SETUP) ──────────────────────
[env:mega_ramps14]
extends = common_avr
board = megaatmega2560
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DBOARD_MEGA
    -DSHIELD_RAMPS14
    -DHAS_TMC_UART
upload_speed = 115200

; ── Arduino Mega 2560 (standalone, no shield) ────────────────────────────────
[env:mega]
extends = common_avr
board = megaatmega2560
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DBOARD_MEGA

; ── Arduino Nano (ATmega328P) ────────────────────────────────────────────────
[env:nano]
extends = common_avr
board = nanoatmega328
build_flags =
    ${common.build_flags}
    -DBOARD_NANO
    -DPLANNER_BUFFER_SIZE=12
    -DSERIAL_RX_BUFFER_SIZE=128

; ── ESP32 DevKit (standalone — full WiFi/BT + motion control) ────────────────
[env:esp32]
extends = common_esp32
board = esp32dev
lib_deps =
    ${common.lib_deps}
    ESP Async WebServer@^1.2.3
    AsyncTCP@^1.1.1
    ArduinoJson@^7.0.0
build_flags =
    ${common.build_flags}
    -DBOARD_ESP32
    -DHAS_WIFI
    -DHAS_BLUETOOTH
    -DHAS_TMC_UART
    -DPLANNER_BUFFER_SIZE=32

; ── Hybrid: Mega (motion) + ESP32 (WiFi bridge) ─────────────────────────────
; Flash this to the MEGA in a hybrid setup
[env:mega_hybrid]
extends = common_avr
board = megaatmega2560
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DBOARD_MEGA
    -DSHIELD_RAMPS14
    -DHYBRID_MODE
    -DHAS_TMC_UART

; Flash this to the ESP32 in a hybrid setup
[env:esp32_bridge]
extends = common_esp32
board = esp32dev
lib_deps =
    ESP Async WebServer@^1.2.3
    AsyncTCP@^1.1.1
    ArduinoJson@^7.0.0
build_flags =
    ${common.build_flags}
    -DBOARD_ESP32
    -DBRIDGE_MODE
    -DHAS_WIFI
    -DHAS_BLUETOOTH

; ── Hybrid: Nano (motion) + ESP32 (WiFi bridge) ─────────────────────────────
[env:nano_hybrid]
extends = common_avr
board = nanoatmega328
build_flags =
    ${common.build_flags}
    -DBOARD_NANO
    -DHYBRID_MODE
    -DPLANNER_BUFFER_SIZE=12
    -DSERIAL_RX_BUFFER_SIZE=128

; ── Native (unit tests on host PC) ──────────────────────────────────────────
[env:native]
platform = native
build_flags =
    ${common.build_flags}
    -DBOARD_NATIVE
    -DUNIT_TEST
test_build_src = yes
